[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysyzygos"
dynamic = ["version"]
description = "Asteroid occultation predictions for your observing site: JPL Horizons orbits, a local Gaia DR3 catalog, a web interface"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Percy Zahl" }]
keywords = ["asteroid", "occultation", "astronomy", "Gaia", "SPICE", "IOTA", "syzygy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "requests",
    "scipy",
    "spiceypy",
    "astropy",
    "astroquery",
    "pandas",
    "nicegui",
    "pillow",
]

[project.urls]
Homepage = "https://github.com/pyzahl/PySyzygos"
Changelog = "https://github.com/pyzahl/PySyzygos/blob/main/CHANGELOG.md"

[project.scripts]
pysyzygos = "pysyzygos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysyzygos = ["*.svg", "*.png", "data/*.json", "data/*.md", "data/*.npy", "templates/*.py"]

[tool.setuptools.dynamic]
version = { attr = "pysyzygos.version.__version__" }
